# Single (default) profile. Hostnames resolve to the Kubernetes Services in k8s/ (namespace "oms").
server:
  port: 9999
  shutdown: graceful
spring:
  application:
    name: oms-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:30432/meracommerce_oms?sslmode=disable}
    username: ${DB_USERNAME:oms_app}
    password: ${DB_PASSWORD:oms_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OMSAppHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 5
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 5000
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    # validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # Flyway is the single source of truth for the schema
    properties:
      '[hibernate.jdbc.time_zone]': UTC
  # flyway:
  #   enabled: true
  #   locations: classpath:db/migration


  data:
    # redis:
    #   host: ${REDIS_HOST:redis}
    #   port: ${REDIS_PORT:6379}
    #   timeout: 1500ms
    redis:
      host: localhost
      port: 30379
      password: "RedisDevOnly123!"
      database: 0
      timeout: 3000ms
      connect-timeout: 3000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 5
          max-idle: 3
          min-idle: 2
          max-wait: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:30094}
    admin:
      fail-fast: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable:
          idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: 3
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

oms:
  kafka:
    partitions: 3
    replicas: 1
  outbox:
    poll-interval-ms: 1000
    batch-size: 50
    max-attempts: 2 # first attempt + 1 retry, then parked in failed_events
  sourcing:
    max-resourcing-attempts: 3
  idempotency:
    lock-ttl-seconds: 30
  rma:
    reverse-hub: RHUB-BLR-01
    return-window-days: 7
  stub: # in-process downstream simulators (WMS/payment/logistics/finance)
    enabled: true
    auto-deliver: true
